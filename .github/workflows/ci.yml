name: Multiplatform C++26 Verification

on:
  push:
    branches: [ "main", "features" ]
  pull_request:
    branches: [ "main", "features" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # LINUX CONFIGURATION
      - name: Setup Linux packages
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update && sudo apt-get install -y g++-14 gcc-14
          echo "CXX=g++-14" >> $GITHUB_ENV
          echo "CC=gcc-14" >> $GITHUB_ENV

      # MACOS CONFIGURATION
      - name: Setup macOS packages
        if: matrix.os == 'macos-14'
        run: |
          brew install gcc
          echo "CXX=g++-14" >> $GITHUB_ENV
          echo "CC=gcc-14" >> $GITHUB_ENV

      # WINDOWS CONFIGURATION
      - name: Setup Windows MSYS2 Environment
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      # COMPILE BLOCK (Cross-Platform Execution)
      - name: Run Build Core
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake -B build -G "Ninja" -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc
          else
            cmake -B build -DCMAKE_CXX_COMPILER=$CXX -DCMAKE_C_COMPILER=$CC
          fi
          cmake --build build
