name: C++ CI Build

on:
  push:
    branches: [ "main", "features" ]
    paths-ignore:
      - 'README.md'
      - 'SECURITY.md'
      - '.gitignore'
      - '.github/**'
  pull_request:
    branches: [ "main", "features" ]
    paths-ignore:
      - 'README.md'
      - 'SECURITY.md'
      - '.gitignore'
      - '.github/**'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout local repository code
        uses: actions/checkout@v4

      # Windows setup for the modern UCRT toolchain
      - name: Setup GCC & CMake (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      # Windows Compilation Route
      - name: Configure CMake Project (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: cmake -B build -G "Ninja"

      - name: Build all targets (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: cmake --build build

      # Linux / macOS Compilation Route
      - name: Configure CMake Project (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake -B build -G "Unix Makefiles"

      - name: Build all targets (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build
