name: C++26 Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04  # Uses a fresh base environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install GCC 14/15 which fully supports C++26 features
      - name: Install C++26 Compiler
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14

      # 2. Tell CMake to explicitly target the new C++26 compiler binaries
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14

      # 3. Compile all your targets
      - name: Build All Targets
        run: cmake --build build
